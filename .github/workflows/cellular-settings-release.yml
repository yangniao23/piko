name: Release Piko with cellular data saver

on:
  push:
    branches:
      - cellular-data-saver-settings
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellular-settings-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'yangniao23/piko' && github.ref == 'refs/heads/cellular-data-saver-settings'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: burrunan/gradle-cache-action@v3

      - name: Check chat version routing
        run: python3 .github/scripts/check_chat_version_routing.py

      - name: Set custom release version
        run: |
          UPSTREAM_VERSION=$(sed -n 's/^version *= *//p' gradle.properties)
          VERSION="${UPSTREAM_VERSION}-cellular.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Build Android patch bundle and check strings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew buildAndroid :patches:checkStringResources :patches:generatePatchesList -Pversion="$VERSION" --console=plain

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp "patches/build/libs/patches-${VERSION}.mpp" dist/
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          patch_list = json.loads(Path("patches-list.json").read_text())
          for name in ("Cellular data saver", "Spoof client version"):
              matches = [patch for patch in patch_list["patches"] if patch["name"] == name]
              if len(matches) != 1:
                  raise SystemExit(f"{name} must be present exactly once in the loaded patch list")
          patch_list["version"] = version
          Path("dist/patches-list.json").write_text(json.dumps(patch_list, indent=2) + "\n")
          metadata = {
              "version": version,
              "download_url": f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{os.environ["TAG"]}/patches-{version}.mpp',
              "created_at": datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None).isoformat(),
              "description": "Piko with opt-in Cellular data saver and Spoof client version for X Chat. Full bundle for X 12.19.1-release.0; on-device behavior unverified.",
          }
          Path("dist/patches-bundle.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          (cd dist && sha256sum *.mpp patches-bundle.json patches-list.json > SHA256SUMS)
          cat > "$RUNNER_TEMP/cellular-settings-notes.md" <<'EOF'
          Full Piko patch bundle with **Cellular data saver** and **Spoof client version** for X Chat.

          - X target: **12.19.1-release.0** (APKM).
          - Import the MPP into Morphe and select **Cellular data saver** with your other Piko patches.
          - Select **Spoof client version** to work around X Chat's **Update Required** rejection. Keep its default reported version (`12.41.0-prod.01`, code `312410001`). Repatch the original APKM; updating the MPP alone does not modify the installed app.
          - Chat fix adapted from https://github.com/crimera/piko/pull/2302 (not yet merged upstream).
          - Enable automatic data saver in Piko settings after patching; it is off by default.
          - This replaces the full Piko bundle. It is different from the older standalone **Cellular-only data saver** patch.
          - Build, string checks, chat request routing tests, and loaded patch list checks passed. APK patching and on-device behavior remain unverified in this fork.

          The MPP is unsigned; SHA256SUMS is provided for file integrity checks.
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: piko-cellular-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Piko $VERSION (cellular data saver)" \
            --notes-file "$RUNNER_TEMP/cellular-settings-notes.md" \
            --latest=false

      - name: Update Morphe source metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          branch = api(f"repos/{repo}")["default_branch"]
          existing = api(f"repos/{repo}/contents/patches-bundle.json?ref={branch}")
          payload = {
              "message": f'chore: update cellular saver source to {os.environ["VERSION"]} [skip ci]',
              "branch": branch,
              "sha": existing["sha"],
              "content": base64.b64encode(Path("dist/patches-bundle.json").read_bytes()).decode(),
          }
          subprocess.run(
              ["gh", "api", "--method", "PUT", f"repos/{repo}/contents/patches-bundle.json", "--input", "-", "--silent"],
              input=json.dumps(payload), text=True, check=True,
          )
          PY
